name: Build ServEasy Provider Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Production Release Signing & Hermes Bundling
        run: node scripts/configure-release-build.js

      - name: Bundle Offline JavaScript for Production
        run: |
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Standalone Production Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APKs for Easy Identification
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ServEasy-Provider.apk
          cp android/app/build/outputs/apk/release/app-release.apk "ServEasy-Provider-${{ github.ref_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServEasy-Provider-App-APK
          path: |
            ServEasy-Provider.apk
            ServEasy-Provider-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ServEasy Provider App ${{ github.ref_name }}
          files: |
            ServEasy-Provider.apk
            ServEasy-Provider-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
